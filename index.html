<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hadas Atias</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;800&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f3f8;--fg:#211a27;--card:#fff;--acc:#7a2e5a;--accfg:#fff;--mut:#756d7d;--bd:#e3dce8;--soft:#ece4f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121b;--fg:#f0eaf4;--card:#221b29;--acc:#d48ab8;--accfg:#1a0f17;--mut:#a79bb0;--bd:#372d40;--soft:#2c2335}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Heebo,Arial,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
h1,h2,.logo{font-family:'Frank Ruhl Libre',Georgia,serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 5vw;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{font-size:26px;font-weight:800;letter-spacing:.5px;margin-inline-end:auto}
nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
nav a{padding:4px 2px;border-bottom:2px solid transparent}
nav a.on{border-color:var(--acc)}
main{padding:28px 5vw 60px;max-width:1100px;margin:auto}
.hero{padding:48px 0 36px}
.hero h1{font-size:clamp(38px,8vw,72px);line-height:1.05;margin:0 0 14px;font-weight:800}
.hero p{max-width:46ch;color:var(--mut);font-size:18px}
.btn{display:inline-block;background:var(--acc);color:var(--accfg);border:0;padding:10px 20px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.btn.sm{padding:5px 14px;font-size:14px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.card img{width:100%;aspect-ratio:5/6;object-fit:cover;display:block}
.card .b{padding:12px 14px 16px;display:flex;flex-direction:column;gap:8px}
.price{color:var(--acc);font-weight:700}
form.box,.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;max-width:420px;margin:20px auto}
.panel{max-width:none}
label{display:block;font-size:14px;color:var(--mut);margin-top:12px}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:middle}
.scroll{overflow-x:auto}
td img{width:48px;height:58px;object-fit:cover;border-radius:8px}
td input{min-width:90px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--mut);background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:14px}
.pdp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;margin-top:16px}
.big{width:100%;border-radius:14px;aspect-ratio:5/6;object-fit:cover;display:block}
.thumbs{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.thumbs img{width:72px;height:86px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--bd)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.badge{background:var(--acc);color:var(--accfg);border-radius:999px;padding:0 7px;font-size:12px;margin-inline-start:4px}
.err{color:#c0392b;min-height:1.4em;margin:10px 0 0}
</style>
</head>
<body>
<header><a class="logo" href="#/">Hadas Atias</a><nav id="nav"></nav></header>
<main id="app"><p>טוען...</p></main>
<div id="toast"></div>
<script>
const SB_URL='https://bduwoywwzostwfsaphps.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkdXdveXd3em9zdHdmc2FwaHBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0Nzg2MzAsImV4cCI6MjEwNzA1NDYzMH0.Y2z4W98TI-p_AgHiO6hpSong02_jN2rUA4BoInSVqFY';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce'}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ils=n=>'₪'+Number(n).toLocaleString('he-IL');
const val=id=>$(id).value.trim();
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)};
const go=h=>location.hash===h?render():(location.hash=h);
const svg=(e,c)=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360"><rect width="300" height="360" fill="${c}"/><text x="150" y="215" font-size="120" text-anchor="middle">${e}</text></svg>`);
const imgs=q=>q.images&&q.images.length?q.images:[svg('👗','#e4d7ea')];
const redir=()=>location.origin+location.pathname;
let user=null,prof=null,products=[],cart=[],orders=[],settings={manager_phone:'',bit_link:''},ready=false,afterLogin=false,lastOrder=null,pendingFiles=[],pendingDel=null;
const isAdmin=()=>prof&&prof.role==='admin';
const cartCount=()=>cart.reduce((a,b)=>a+b.quantity,0);
const qOf=id=>(cart.find(c=>c.product_id===id)||{quantity:0}).quantity;
const cartInfo=()=>{const items=cart.map(c=>({p:products.find(x=>x.id===c.product_id),q:c.quantity})).filter(x=>x.p);return{items,tot:items.reduce((a,x)=>a+Number(x.p.price)*x.q,0)}};

async function reloadCart(){cart=user?((await sb.from('cart_items').select('product_id,quantity').order('product_id')).data||[]):[]}
async function loadAll(){
  try{
    const [p,s]=await Promise.all([sb.from('products').select('*').order('id'),sb.from('settings').select('*').eq('id',1).maybeSingle()]);
    if(p.error)throw p.error;products=p.data||[];if(s.data)settings=s.data;
    prof=null;orders=[];cart=[];
    if(user){
      prof=(await sb.from('profiles').select('*').eq('id',user.id).maybeSingle()).data;
      await reloadCart();
      if(isAdmin())orders=(await sb.from('orders').select('*,order_items(*)').order('id',{ascending:false})).data||[];
    }
  }catch(e){toast('שגיאה בטעינת הנתונים: '+(e.message||e))}
}
sb.auth.onAuthStateChange((ev,s)=>{setTimeout(async()=>{
  const uid=s&&s.user?s.user.id:null;
  if(ev==='SIGNED_IN'&&ready&&!afterLogin&&uid===(user&&user.id))return;
  user=s?s.user:null;await loadAll();ready=true;
  if(ev==='PASSWORD_RECOVERY')return go('#/reset');
  if(afterLogin&&user){afterLogin=false;return go(isAdmin()?'#/admin':'#/shop')}
  render()},0)});

const run=async f=>{try{await f();await loadAll();render()}catch(e){toast('שגיאה: '+(e.message||e))}};
async function setQty(id,n){const r=n<=0?await sb.from('cart_items').delete().eq('product_id',id):await sb.from('cart_items').upsert({user_id:user.id,product_id:id,quantity:n},{onConflict:'user_id,product_id'});if(r.error)throw r.error}
async function addCart(id){if(!user){toast('צריך להתחבר כדי להוסיף לעגלה');return go('#/login')}
  try{await setQty(id,qOf(id)+1);await reloadCart();nav();toast('נוסף לעגלה')}catch(e){toast('שגיאה: '+e.message)}}
function qty(id,d){run(()=>setQty(id,qOf(id)+d))}

async function login(e){e.preventDefault();const er=$('err');er.textContent='';const u=val('lu');let em=u;
  if(!u.includes('@')){em=(await sb.rpc('email_for_username',{p_username:u})).data}
  if(!em)return er.textContent='שם משתמש או סיסמה שגויים';
  afterLogin=true;
  const{error}=await sb.auth.signInWithPassword({email:em,password:$('lp').value});
  if(error){afterLogin=false;er.textContent=/confirm/i.test(error.message)?'יש לאשר את האימייל לפני ההתחברות':'שם משתמש או סיסמה שגויים'}else toast('התחברת בהצלחה')}
async function logout(){await sb.auth.signOut();toast('התנתקת');go('#/')}
async function register(e){e.preventDefault();const er=$('err'),n=val('rn'),u=val('ru'),em=val('re'),p=$('rp').value;
  if(n.split(/\s+/).filter(Boolean).length<2)return er.textContent='נא למלא שם מלא: שם פרטי ושם משפחה';
  if(u.length<3)return er.textContent='שם משתמש חייב להכיל 3 תווים לפחות';
  if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent='כתובת אימייל לא תקינה';
  if(p.length<6)return er.textContent='הסיסמה חייבת להכיל 6 תווים לפחות';
  if((await sb.rpc('email_for_username',{p_username:u})).data)return er.textContent='שם המשתמש תפוס';
  const{data,error}=await sb.auth.signUp({email:em,password:p,options:{data:{username:u,full_name:n},emailRedirectTo:redir()}});
  if(error)return er.textContent=/registered/i.test(error.message)?'האימייל כבר רשום':'שגיאה בהרשמה: '+error.message;
  if(!data.session){toast('נשלח מייל אישור. אשרו אותו ואז התחברו');return go('#/login')}
  afterLogin=true;toast('נרשמת בהצלחה')}
async function forgot(e){e.preventDefault();const u=val('fu');let em=u;
  if(!u.includes('@')){em=(await sb.rpc('email_for_username',{p_username:u})).data}
  if(em)await sb.auth.resetPasswordForEmail(em,{redirectTo:redir()});
  const er=$('err');er.style.color='inherit';er.textContent='אם החשבון קיים, נשלח אליו מייל לאיפוס סיסמה.'}
async function doReset(e){e.preventDefault();const p=$('np').value,er=$('err');
  if(p.length<6)return er.textContent='הסיסמה חייבת להכיל 6 תווים לפחות';
  const{error}=await sb.auth.updateUser({password:p});if(error)return er.textContent=error.message;toast('הסיסמה עודכנה');go('#/shop')}

const orderMsg=o=>`הזמנה חדשה מ-Hadas Atias\nשם: ${o.customer_name}\nמוצרים: ${o.order_items.map(i=>i.product_name+' x'+i.quantity).join(', ')}\nסה"כ לתשלום: ${ils(o.total)}\nאימייל: ${o.email}\nטלפון: ${o.phone}\nכתובת למשלוח: ${o.address}`;
const normPhone=s=>{let d=String(s).replace(/\D/g,'');if(d.startsWith('0'))d='972'+d.slice(1);return d};
const waLink=o=>'https://wa.me/'+normPhone(settings.manager_phone)+'?text='+encodeURIComponent(orderMsg(o));
function payBit(t){try{navigator.clipboard.writeText(String(t))}catch(e){}toast('הסכום '+ils(t)+' הועתק. מעבירים לביט');window.open(settings.bit_link||'https://www.bitpay.co.il','_blank','noopener')}
async function placeOrder(e){e.preventDefault();const er=$('err'),n=val('cn'),ph=val('cp').replace(/[\s-]/g,''),ad=val('ca');
  if(n.length<2)return er.textContent='נא למלא שם מלא';
  if(!/^05\d{8}$/.test(ph))return er.textContent='נא להזין נייד תקין, לדוגמה 0501234567';
  if(ad.length<8)return er.textContent='נא למלא כתובת מלאה: רחוב, מספר ועיר';
  const{data,error}=await sb.rpc('place_order',{p_name:n,p_phone:ph,p_address:ad});
  if(error)return er.textContent='שגיאה ביצירת ההזמנה: '+error.message;
  await reloadCart();go('#/done/'+data)}

const rsz=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.82)};i.src=r.result};r.readAsDataURL(f)});
async function upload(files){const urls=[];for(const f of files){const b=await rsz(f),n=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const{error}=await sb.storage.from('product-images').upload(n,b,{contentType:'image/jpeg'});if(error)throw error;
  urls.push(sb.storage.from('product-images').getPublicUrl(n).data.publicUrl)}return urls}
function newImg(inp){pendingFiles=[...inp.files];toast(pendingFiles.length+' תמונות נבחרו')}
function addProd(e){e.preventDefault();const n=val('pn'),pr=+val('pp');if(!n||!(pr>0))return toast('מלאו שם ומחיר תקינים');
  run(async()=>{const im=pendingFiles.length?await upload(pendingFiles):[];const{error}=await sb.from('products').insert({name:n,price:pr,description:val('pd'),images:im});if(error)throw error;pendingFiles=[];toast('הפריט נוסף')})}
function saveRow(id){const n=val('n'+id),pr=+val('p'+id);if(!n||!(pr>0))return toast('שם או מחיר לא תקינים');
  run(async()=>{const{error}=await sb.from('products').update({name:n,price:pr,description:val('d'+id)}).eq('id',id);if(error)throw error;toast('נשמר')})}
function rowImg(id,inp){const f=[...inp.files];if(!f.length)return;
  run(async()=>{const im=await upload(f);const{error}=await sb.from('products').update({images:im}).eq('id',id);if(error)throw error;toast('התמונות עודכנו')})}
function delProd(id){
  if(pendingDel!==id){pendingDel=id;render();toast('לחצו שוב כדי לאשר מחיקה');setTimeout(()=>{if(pendingDel===id){pendingDel=null;if(location.hash==='#/admin')render()}},4000);return}
  pendingDel=null;run(async()=>{const{error}=await sb.from('products').delete().eq('id',id);if(error)throw error;toast('הפריט נמחק')})}
function saveSet(){run(async()=>{const{error}=await sb.from('settings').update({manager_phone:val('smgr'),bit_link:val('sbit')}).eq('id',1);if(error)throw error;toast('ההגדרות נשמרו')})}

const pcard=p=>`<div class="card"><a href="#/product/${p.id}"><img src="${esc(imgs(p)[0])}" alt="${esc(p.name)}"></a><div class="b"><a href="#/product/${p.id}">${esc(p.name)}</a><div class="price">${ils(p.price)}</div><button class="btn sm" onclick="addCart(${p.id})">הוספה לעגלה</button></div></div>`;
const authBox=(t,f,body,foot)=>`<form class="box" onsubmit="${f}(event)"><h2 style="margin:0">${t}</h2>${body}<p id="err" class="err"></p><button class="btn" style="width:100%">${t}</button><p style="margin:14px 0 0;font-size:14px">${foot}</p></form>`;
function adminHtml(){return `<h2>ניהול החנות</h2>
<div class="panel"><b>הגדרות הזמנות</b><div class="row"><div style="flex:1;min-width:200px"><label>נייד המנהל לקבלת הודעות הזמנה</label><input id="smgr" value="${esc(settings.manager_phone)}" placeholder="0501234567"></div><div style="flex:1;min-width:200px"><label>קישור תשלום ביט (אופציונלי)</label><input id="sbit" value="${esc(settings.bit_link)}" placeholder="https://..."></div><button class="btn" onclick="saveSet()">שמירה</button></div></div>
<form class="panel" onsubmit="addProd(event)"><b>הוספת פריט</b><div class="row"><input id="pn" placeholder="שם הפריט" style="flex:2;min-width:140px"><input id="pp" type="number" min="1" placeholder="מחיר" style="flex:1;min-width:90px"><input id="pd" placeholder="תיאור" style="flex:3;min-width:180px"><input type="file" accept="image/*" multiple onchange="newImg(this)" style="flex:2;min-width:160px"><button class="btn">הוספה</button></div></form>
<div class="panel scroll"><table><tr><th></th><th>שם</th><th>מחיר ₪</th><th>תיאור</th><th>החלפת תמונות (אפשר כמה)</th><th></th></tr>${products.map(q=>`<tr><td><img src="${esc(imgs(q)[0])}" alt=""></td><td><input id="n${q.id}" value="${esc(q.name)}"></td><td><input id="p${q.id}" type="number" min="1" value="${q.price}"></td><td><input id="d${q.id}" value="${esc(q.description||'')}" style="min-width:200px"></td><td><input type="file" accept="image/*" multiple onchange="rowImg(${q.id},this)"></td><td><div class="row"><button class="btn sm" onclick="saveRow(${q.id})">שמירה</button><button class="btn ghost sm" onclick="delProd(${q.id})">${pendingDel===q.id?'לחצו לאישור מחיקה':'מחיקה'}</button></div></td></tr>`).join('')}</table></div>
<h2>הזמנות</h2>${orders.length?`<div class="panel scroll"><table><tr><th>תאריך</th><th>לקוח</th><th>פריטים</th><th>סה״כ</th></tr>${orders.map(o=>`<tr><td>${esc(new Date(o.created_at).toLocaleString('he-IL'))}</td><td>${esc(o.customer_name)}<br>${esc(o.phone)}<br>${esc(o.email)}<br>${esc(o.address)}</td><td>${o.order_items.map(i=>esc(i.product_name)+' ×'+i.quantity).join('<br>')}</td><td>${ils(o.total)}</td></tr>`).join('')}</table></div>`:'<p>אין הזמנות עדיין.</p>'}`}

function nav(){const h=location.hash||'#/',a=x=>h===x?' class="on"':'';
  $('nav').innerHTML=`<a href="#/"${a('#/')}>בית</a><a href="#/shop"${a('#/shop')}>חנות</a>`+(isAdmin()?`<a href="#/admin"${a('#/admin')}>ניהול</a>`:'')+
  `<a href="#/cart"${a('#/cart')}>עגלה${cartCount()?`<span class="badge">${cartCount()}</span>`:''}</a>`+
  (user?`<span style="color:var(--mut)">${esc(prof?(prof.full_name||prof.username):'')}</span><button class="btn ghost sm" onclick="logout()">התנתקות</button>`:`<a href="#/login"${a('#/login')}>התחברות</a><a class="btn sm" href="#/register">הרשמה</a>`)}

async function render(){
  nav();const app=$('app');if(!ready){app.innerHTML='<p>טוען...</p>';return}
  const h=(location.hash||'#/').slice(1);let o='';
  if(h==='/'){o=`<section class="hero"><h1>Hadas Atias</h1><p>בגדים שנוחים ללבוש ויפים להסתכל עליהם. הקולקציה החדשה כבר בחנות.</p><a class="btn" href="#/shop">לחנות</a></section><h2>חדש בחנות</h2><div class="grid">${products.slice(0,4).map(pcard).join('')}</div>`}
  else if(h==='/shop'){o=`<h2>החנות</h2>${products.length?`<div class="grid">${products.map(pcard).join('')}</div>`:'<p>אין עדיין פריטים בחנות.</p>'}`}
  else if(h.startsWith('/product/')){const q=products.find(x=>x.id==h.split('/')[2]);
    if(!q)o='<h2>הפריט לא נמצא</h2><a class="btn" href="#/shop">לחנות</a>';
    else{const im=imgs(q);o=`<a href="#/shop" style="color:var(--mut)">חזרה לחנות</a><div class="pdp"><div><img id="big" class="big" src="${esc(im[0])}" alt="${esc(q.name)}"><div class="thumbs">${im.map(x=>`<img src="${esc(x)}" alt="" onclick="$('big').src=this.src">`).join('')}</div></div><div><h1 style="margin:0 0 6px">${esc(q.name)}</h1><div class="price" style="font-size:24px">${ils(q.price)}</div><p style="color:var(--mut);max-width:50ch">${esc(q.description||'')}</p><button class="btn" onclick="addCart(${q.id})">הוספה לעגלה</button></div></div>`}}
  else if(h==='/cart'){
    if(!user)o=`<h2>עגלת קניות</h2><p>התחברו כדי לראות את העגלה.</p><a class="btn" href="#/login">התחברות</a>`;
    else{const{items,tot}=cartInfo();o=`<h2>עגלת קניות</h2>`+(items.length?`<div class="panel scroll"><table>${items.map(x=>`<tr><td><img src="${esc(imgs(x.p)[0])}" alt=""></td><td>${esc(x.p.name)}</td><td><div class="row"><button class="btn ghost sm" onclick="qty(${x.p.id},-1)">−</button>${x.q}<button class="btn ghost sm" onclick="qty(${x.p.id},1)">+</button></div></td><td>${ils(x.p.price*x.q)}</td></tr>`).join('')}</table><p style="font-size:20px"><b>סה״כ: ${ils(tot)}</b></p><button class="btn" onclick="go('#/checkout')">להמשך להזמנה</button></div>`:`<p>העגלה ריקה. <a href="#/shop" style="text-decoration:underline">לחנות</a></p>`)}}
  else if(h==='/checkout'){
    if(!user)o=`<h2>פרטי משלוח</h2><p>התחברו כדי להזמין.</p><a class="btn" href="#/login">התחברות</a>`;
    else{const{items,tot}=cartInfo();o=items.length?`<h2>פרטי משלוח</h2><form class="box" onsubmit="placeOrder(event)"><label>שם מלא</label><input id="cn" autocomplete="name" value="${esc(prof&&prof.full_name||'')}"><label>טלפון נייד</label><input id="cp" type="tel" placeholder="0501234567" autocomplete="tel"><label>כתובת למשלוח</label><input id="ca" placeholder="רחוב, מספר ועיר" autocomplete="street-address"><p style="font-size:18px"><b>סה״כ: ${ils(tot)}</b></p><p id="err" class="err"></p><button class="btn" style="width:100%">אישור הזמנה</button></form>`:`<h2>פרטי משלוח</h2><p>העגלה ריקה.</p><a class="btn" href="#/shop">לחנות</a>`}}
  else if(h.startsWith('/done/')){const id=h.split('/')[2];
    if(!user)o='<h2>התחברו כדי לראות את ההזמנה</h2><a class="btn" href="#/login">התחברות</a>';
    else{if(!lastOrder||String(lastOrder.id)!==id)lastOrder=(await sb.from('orders').select('*,order_items(*)').eq('id',id).maybeSingle()).data;const d=lastOrder;
      o=!d?'<h2>ההזמנה לא נמצאה</h2><a class="btn" href="#/">לדף הבית</a>':`<h2>תודה ${esc(d.customer_name)}, ההזמנה התקבלה</h2><div class="panel"><p>${d.order_items.map(i=>esc(i.product_name)+' ×'+i.quantity).join('<br>')}</p><p>משלוח אל: ${esc(d.address)}<br>טלפון: ${esc(d.phone)}</p><p style="font-size:22px"><b>לתשלום: ${ils(d.total)}</b></p><div class="row"><button class="btn" onclick="payBit(${Number(d.total)})">תשלום בביט</button>${settings.manager_phone?`<a class="btn ghost" href="${esc(waLink(d))}" target="_blank" rel="noopener">שליחת פרטי ההזמנה לחנות בוואטסאפ</a>`:''}</div><p class="note">לחיצה על "תשלום בביט" מעתיקה את הסכום ופותחת את ביט. הזינו שם את הסכום.</p></div>`}}
  else if(h==='/login'){o=authBox('התחברות','login',`<label>שם משתמש או אימייל</label><input id="lu" autocomplete="username"><label>סיסמה</label><input id="lp" type="password" autocomplete="current-password">`,`<a href="#/forgot" style="text-decoration:underline">שכחתי סיסמה</a> · <a href="#/register" style="text-decoration:underline">אין לי חשבון</a>`)}
  else if(h==='/register'){o=authBox('הרשמה','register',`<label>שם מלא</label><input id="rn" autocomplete="name"><label>שם משתמש</label><input id="ru" autocomplete="username"><label>אימייל</label><input id="re" type="email"><label>סיסמה (6 תווים לפחות)</label><input id="rp" type="password" autocomplete="new-password">`,`יש לך חשבון? <a href="#/login" style="text-decoration:underline">להתחברות</a>`)}
  else if(h==='/forgot'){o=authBox('איפוס סיסמה','forgot',`<label>שם משתמש או אימייל</label><input id="fu">`,`<a href="#/login" style="text-decoration:underline">חזרה להתחברות</a>`)}
  else if(h==='/reset'){o=user?authBox('סיסמה חדשה','doReset',`<label>סיסמה חדשה</label><input id="np" type="password" autocomplete="new-password">`,''):'<p>הקישור לאיפוס אינו תקף. נסו לבקש איפוס מחדש.</p>'}
  else if(h==='/admin'){o=isAdmin()?adminHtml():`<h2>ניהול</h2><p>הדף הזה למנהלים בלבד.</p><a class="btn" href="#/login">התחברות כמנהל</a>`}
  else o='<h2>העמוד לא נמצא</h2><a class="btn" href="#/">לדף הבית</a>';
  app.innerHTML=o}
window.addEventListener('hashchange',()=>{scrollTo(0,0);render()});
</script>
</body>
</html>
